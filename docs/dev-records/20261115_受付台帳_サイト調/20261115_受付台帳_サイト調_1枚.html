.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.memo{background:#fff6d6;color:#3d3423;font-size:14px;line-height:1.6;padding:10px var(--gut);border-bottom:1px solid #e6d9a8}
.memo b{font-weight:700}

/* 頭: サイトと同じ白地に細い罫。左にロゴと協会名、右に画面の切替 */
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;height:var(--hd);padding:0 0 0 var(--gut);background:rgba(253,252,249,.97);border-bottom:1px solid var(--line)}
.top__brand{display:flex;align-items:center;gap:8px;min-width:0;text-decoration:none}
.top__logo{width:40px;height:40px;object-fit:contain;flex:none}
.top__org{display:grid;gap:2px;font-family:"KTTA Zen Kaku",var(--jp);font-weight:700;font-size:19px;line-height:1.05;color:var(--navy);white-space:nowrap;font-feature-settings:normal}
.top__org small{font-family:var(--num);font-size:10px;font-weight:700;line-height:1.1;letter-spacing:0}
.top__sub{font-size:13px;font-weight:700;color:var(--sub);white-space:nowrap;padding-left:12px;border-left:1px solid var(--line)}
.top__nav{margin-left:auto;display:flex;align-self:stretch;flex:none}
.top__nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 11px;font-size:14px;font-weight:700;text-decoration:none;color:var(--ink);white-space:nowrap}
.top__nav a::after{content:"";position:absolute;left:11px;right:11px;bottom:0;height:3px;background:var(--navy);transform:scaleX(0);transform-origin:left;transition:transform .2s ease}
.top__nav a[aria-current]{color:var(--navy)}
.top__nav a[aria-current]::after{transform:scaleX(1)}
.top__nav a:hover{background:var(--sky);color:#245d8e}

/* 大会の見出し: サイトの記事見出しと同じく、紺の小見出し+大きい和文 */
.head{padding:18px var(--gut) 14px;display:grid;gap:12px}
.head h1{margin:0;font-size:22px;line-height:1.4;font-weight:700}
.head__meta{font-size:14px;color:var(--sub);line-height:1.6}
.head__meta b{color:var(--navy);font-family:var(--num);font-weight:800;font-size:16px}
.state{display:inline-flex;align-items:center;font-size:12px;font-weight:700;line-height:1.4;padding:4px 9px;border-radius:3px;background:var(--red);color:#fdfcf9;vertical-align:4px;margin-left:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border:1px solid var(--line);background:var(--card);border-radius:4px;font-size:15px;font-weight:700;text-decoration:none;white-space:nowrap;color:var(--navy);transition:background-color .2s ease,border-color .2s ease}
.btn:hover{border-color:var(--navy);background:var(--sky)}
.btn--main{background:var(--navy);border-color:var(--navy);color:#fdfcf9}
.btn--main:hover{background:var(--navy-d);border-color:var(--navy-d);color:#fdfcf9}
.btn--quiet{color:var(--sub)}
.btn:active{transform:scale(.98)}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.tag{display:inline-block;font-size:13px;line-height:1.3;font-weight:700;padding:3px 8px;border-radius:3px;white-space:nowrap}
.tag--dup{background:var(--dup-bg);color:var(--dup)}
.tag--warn{background:var(--warn-bg);color:var(--warn)}
.tag--route{background:var(--sky);color:var(--navy)}

.routes{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:14px;color:var(--sub)}
.routes b{color:var(--navy);font-family:var(--num);font-weight:800}

/* 下から出る詳細（スマホ） */
.sheet-bg{position:fixed;inset:0;background:rgba(14,30,55,.42);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--paper);max-height:86dvh;overflow:auto;border-top:2px solid var(--ink);padding:14px var(--gut) calc(18px + env(safe-area-inset-bottom));border-radius:8px 8px 0 0}
.sheet h2{margin:0;font-size:19px;line-height:1.4;font-weight:700}
.sheet__x{position:sticky;top:0;float:right;min-width:44px;min-height:44px;border:0;background:none;font-size:15px;font-weight:700;color:var(--navy)}
.plist{list-style:none;margin:12px 0;padding:0;border-top:1px solid var(--line)}
.plist li{padding:9px 0;border-bottom:1px solid var(--line)}
.plist small{display:block;font-size:13px;color:var(--sub);font-weight:500}
.plist b{font-weight:700}
.toast{position:fixed;left:50%;bottom:20px;translate:-50% 0;background:var(--navy);color:#fdfcf9;padding:10px 16px;border-radius:4px;font-size:15px;z-index:40;max-width:calc(100% - 32px)}

/* 大会の一覧: サイトの「大会申込一覧」と同じ行の組み方（日付を英数字で大きく） */
.tl{margin:0 var(--gut) 28px;border-top:2px solid var(--ink)}
.tl__row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;align-items:center;transition:background .15s}
.tl__row:hover{background:rgba(20,41,74,.05)}
.tl__name{font-size:17px;font-weight:700;line-height:1.5}
.tl__meta{grid-column:1;font-size:14px;color:var(--sub)}
.tl__meta b{color:var(--navy)}
.tl__count{grid-row:1/span 2;grid-column:2;text-align:right;font-size:13px;color:var(--sub);line-height:1.35}
.tl__count b{display:block;font-family:var(--num);font-size:30px;color:var(--navy);font-weight:800;line-height:1}

@media (max-width:480px){.top__sub{display:none}.top__org{font-size:17px}.top__nav a{padding:0 9px}.top__nav a::after{left:9px;right:9px}}
@media (min-width:960px){
  :root{--gut:28px;--hd:80px}
  .top__logo{width:52px;height:52px}
  .top__org{font-size:24px}
  .top__org small{font-size:12px}
  .head{grid-template-columns:1fr auto;align-items:end;padding-top:26px}
  .head h1{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* 案A: 強さの源 = 表。紙の受付帳簿の感覚で、団体ごとの1行に種目別の人数が並ぶ。
   Excelで原本を扱ってきた本部の人が、説明なしで読める形にする。 */
.tools{display:grid;gap:10px;padding:0 var(--gut) 12px}
.find{display:flex;gap:8px}
.search{flex:1;min-width:0;width:100%;min-height:46px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:16px}
.search:focus{border-color:var(--navy)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 10px;border:1px solid var(--line);background:var(--card);border-radius:4px;font-size:14px;font-weight:700;color:var(--navy)}
.chip:hover{border-color:var(--navy)}
.chip b{font-family:var(--num);font-weight:800;font-size:15px;margin-left:3px}
.chip[aria-pressed="true"]{background:var(--navy);color:#fdfcf9;border-color:var(--navy)}
.chip--warn[aria-pressed="false"]{color:var(--warn);border-color:#dcc89a;background:var(--warn-bg)}

/* スマホ: 横スクロールさせず、団体ごとに2段で読ませる */
.ledger{margin:0 var(--gut);border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;padding:11px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.row__team{grid-column:1;grid-row:1;font-size:17px;font-weight:700;line-height:1.4}
.row__sum{font-family:var(--num);color:var(--navy);font-size:28px;font-weight:800;line-height:1.1;text-align:right;grid-column:2;grid-row:1}
.row__sum small{font-family:var(--jp);font-size:12px;font-weight:700;font-weight:500;color:var(--sub);margin-left:2px}
.row__by{grid-column:1/-1;font-size:15px;color:var(--sub)}
.row__by b{color:var(--navy);font-family:var(--num);font-weight:800;font-size:16px}
.row__tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.totals{margin:14px var(--gut) 96px;padding:10px 0;border-top:2px solid var(--ink);display:grid;grid-template-columns:repeat(2,1fr);gap:4px 16px;font-size:15px}
.totals div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line2);padding:4px 0}
.totals b{font-weight:800;color:var(--navy);font-size:17px}
.dock{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px var(--gut) calc(8px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -8px 20px -14px rgba(14,30,55,.18);z-index:10}

.table{display:none}
.side{display:none}
@media (min-width:960px){
  .tools{grid-template-columns:minmax(380px,460px) 1fr;align-items:center}
  .filters{justify-content:flex-end}
  .ledger,.totals,.dock{display:none}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:0 var(--gut) 24px;align-items:start}
  .table{display:block;max-height:calc(100dvh - 280px);overflow:auto;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:15px}
  th,td{padding:0 10px;height:46px;border-bottom:1px solid var(--line2);text-align:center;white-space:nowrap;background:var(--paper)}
  thead th{position:sticky;top:0;z-index:2;background:var(--wash);border-bottom:1px solid var(--ink);font-size:13px;font-weight:700;color:var(--sub)}
  tfoot td{position:sticky;bottom:0;z-index:2;background:var(--sky);border-top:1px solid var(--ink);border-bottom:0;font-weight:800;color:var(--navy)}
  th:first-child,td:first-child{position:sticky;left:0;z-index:1;text-align:left;font-weight:700}
  thead th:first-child,tfoot td:first-child{z-index:3}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:#f3f6f9}
  tbody tr[aria-selected="true"] td{background:var(--sky);box-shadow:inset 0 -2px 0 var(--navy)}
  td.zero{color:#a3a7ad}
  td.num{font-size:16px;font-weight:700}
  td.sum{font-weight:800;color:var(--navy);font-size:17px}
  .side{display:block;position:sticky;top:96px;border-top:2px solid var(--ink);padding-top:12px}
  .side h2{margin:0;font-size:20px;font-weight:700}
  .side__out{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:8px}
  .side__empty{font-size:15px;color:var(--sub)}
}
</style>

<body>
<div class="memo"><b>見本「受付台帳」サイト調（1案）</b> 11-10に決めた受付台帳の並びはそのままに、色・書体・罫線を協会の新サイトに合わせました。データはすべて架空です。</div>
<div id="app"></div>
<script>// 見本専用の架空データと小道具。氏名・団体はすべて架空で、実在の人物とは関係ない。
(function () {
  function h(tag, attrs) {
    var el = document.createElement(tag);
    Object.entries(attrs || {}).forEach(function (kv) {
      var k = kv[0], v = kv[1];
      if (v == null || v === false) return;
      if (k === "class") el.className = v;
      else if (k.indexOf("on") === 0) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    });
    [].slice.call(arguments, 2).flat(Infinity).forEach(function (c) {
      if (c == null || c === false) return;
      el.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
    });
    return el;
  }

  var EVENTS = [
    { key: "一般男子シングルス", short: "一般男", cap: 48, last: 41 },
    { key: "一般女子シングルス", short: "一般女", cap: 32, last: 24 },
    { key: "中学男子シングルス", short: "中学男", cap: 48, last: 39 },
    { key: "中学女子シングルス", short: "中学女", cap: 32, last: 22 },
    { key: "男子ダブルス", short: "男D", cap: 24, last: 14 },
    { key: "女子ダブルス", short: "女D", cap: 24, last: 9 },
    { key: "団体戦", short: "団体", cap: 12, last: 7 },
  ];
  var FAM = "架空 試験 見本 仮名 空想 例示 模擬 検証 標本 想定".split(" ");
  var FK = ["かくう", "しけん", "みほん", "かりな", "くうそう", "れいじ", "もぎ", "けんしょう", "ひょうほん", "そうてい"];
  var GIV = "太郎 花子 次郎 美咲 健太 陽菜 拓海 結衣 大輝 葵 蓮 凛".split(" ");
  var GK = "たろう はなこ じろう みさき けんた ひな たくみ ゆい だいき あおい れん りん".split(" ");
  var TEAMS = ["第一試験クラブ", "見本中学校", "架空スポーツ少年団", "検証卓球会", "模擬中学校", "例示クラブ", "標本高校OB会", "想定卓友会", "空想ジュニア", "仮名クラブ", "第二試験クラブ", "見本南中学校"];

  // 同じ見本が毎回同じ数字になるよう、乱数は使わず添字から作る
  var n = 0;
  function person() {
    var f = n % 10, g = (n * 7 + (n % 3)) % 12;
    n++;
    return { name: FAM[f] + " " + GIV[g], kana: FK[f] + " " + GK[g] };
  }
  var SUBS = [];
  for (var i = 0; i < 28; i++) {
    var team = TEAMS[i % TEAMS.length], entries = [];
    var count = 1 + (i * 3) % 4;
    for (var j = 0; j < count; j++) {
      var ev = EVENTS[(i * 2 + j) % 4], p = person();
      entries.push({ ev: ev.key, label: p.name, kana: p.kana });
    }
    if (i % 3 === 0) { var a = person(), b = person(); entries.push({ ev: "男子ダブルス", label: a.name + "・" + b.name, kana: a.kana + "・" + b.kana }); }
    if (i % 5 === 1) { var c = person(), d = person(); entries.push({ ev: "女子ダブルス", label: c.name + "・" + d.name, kana: c.kana + "・" + d.kana }); }
    if (i % 7 === 0) entries.push({ ev: "団体戦", label: team + "A（4名）", kana: "" });
    SUBS.push({
      id: "s" + i, team: (i >= 24 ? "西" : i >= 12 ? "東" : "") + team,
      contact: "連絡 担当" + (i + 1),
      route: i % 11 === 4 ? "Excel" : i % 19 === 7 ? "手入力" : "Web",
      at: "11月" + (2 + (i % 9)) + "日",
      entries: entries, issues: [],
    });
  }
  // 確認が要る例
  var dupName = SUBS[0].entries[0].label;
  SUBS[9].entries.unshift({ ev: SUBS[0].entries[0].ev, label: dupName, kana: SUBS[0].entries[0].kana });
  SUBS[0].issues.push({ id: "i1", type: "dup", title: "別の団体と重複の疑い", detail: dupName + " さんが " + SUBS[9].team + " からも同じ種目に申し込んでいます" });
  SUBS[9].issues.push({ id: "i2", type: "dup", title: "別の団体と重複の疑い", detail: dupName + " さんが " + SUBS[0].team + " からも同じ種目に申し込んでいます" });
  SUBS[3].issues.push({ id: "i3", type: "name", title: "所属の表記が揺れています", detail: "「検証卓球会」と「検証卓球クラブ」が同じ団体かもしれません" });
  SUBS[6].issues.push({ id: "i4", type: "kana", title: "ふりがなが空欄です", detail: SUBS[6].entries[0].label + " さんのふりがなが入っていません" });
  SUBS[13].issues.push({ id: "i5", type: "class", title: "区分と年齢が合いません", detail: SUBS[13].entries[0].label + " さんは生年月日から見ると一般の区分です" });
  SUBS[17].issues.push({ id: "i6", type: "sheet", title: "シートに届いていません", detail: "本部には保存済みです。もう一度シートへ送れます" });
  SUBS[21].issues.push({ id: "i7", type: "sheet", title: "シートに届いていません", detail: "本部には保存済みです。もう一度シートへ送れます" });

  var T = { name: "架空市民卓球大会", date: "12月6日（日）", venue: "架空市総合体育館", deadline: "11月20日（金）", left: 10 };
  function evCount(key) { return SUBS.reduce(function (s, x) { return s + x.entries.filter(function (e) { return e.ev === key; }).length; }, 0); }
  function entriesTotal() { return SUBS.reduce(function (s, x) { return s + x.entries.length; }, 0); }
  function routeCount(r) { return SUBS.filter(function (s) { return s.route === r; }).length; }
  function issues() { return SUBS.reduce(function (a, s) { return a.concat(s.issues.map(function (i) { return Object.assign({ sub: s }, i); })); }, []); }

  function toast(msg) {
    var t = h("div", { class: "toast", role: "status" }, msg);
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2200);
  }
  function sheet(title, body) {
    var bg = h("div", { class: "sheet-bg", onclick: close });
    var box = h("section", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": title },
      h("button", { class: "sheet__x", type: "button", onclick: close }, "閉じる"),
      h("h2", {}, title), body);
    function close() { bg.remove(); box.remove(); document.removeEventListener("keydown", esc); }
    function esc(e) { if (e.key === "Escape") close(); }
    document.addEventListener("keydown", esc);
    document.body.appendChild(bg); document.body.appendChild(box);
    box.querySelector("button").focus();
    return close;
  }
  // 申込1件の中身（3案共通の部品）
  function subDetail(s) {
    return [
      h("p", { style: "margin:4px 0 0;font-size:15px;color:var(--sub)" }, s.contact + "・" + s.at + " 受付・" + s.route),
      s.issues.map(function (i) { return h("p", { style: "margin:10px 0 0;padding:9px 11px;background:var(--amber-bg);color:var(--amber);font-size:15px;border-radius:3px" }, h("b", {}, i.title), h("br"), i.detail); }),
      h("ul", { class: "plist" }, s.entries.map(function (e) { return h("li", {}, h("b", {}, e.label), h("small", {}, e.ev + (e.kana ? "・" + e.kana : ""))); })),
      h("div", { class: "btns" }, h("button", { class: "btn btn--main", type: "button", onclick: function () { toast("修正画面へ進みます（見本）"); } }, "内容を直す"), h("button", { class: "btn btn--quiet", type: "button", onclick: function () { toast("確認の上で取り消します（見本）"); } }, "この申込を取り消す")),
    ];
  }
  // 大会の一覧（3案共通）。締切が近い順に並べ、終わった大会は下へ送る
  function listView() {
    var rows = [
      { name: T.name, meta: [T.date + "・締切 ", h("b", {}, "あと" + T.left + "日")], team: SUBS.length, entries: entriesTotal(), warn: issues().length },
      { name: "架空冬季オープン", meta: ["1月17日（日）・締切 あと45日"], team: 12, entries: 31, warn: 0 },
      { name: "架空新春大会", meta: ["2月7日（日）・受付はまだ始めていません"], team: 0, entries: 0, warn: 0 },
      { name: "架空秋季リーグ", meta: ["10月18日（日）・受付を終えました"], team: 26, entries: 74, warn: 0 },
    ];
    return h("div", {},
      h("div", { class: "head" }, h("h1", {}, "受付する大会を選ぶ"), h("div", {}, h("button", { class: "btn btn--main", type: "button", onclick: function () { toast("新しい大会の作成へ（見本）"); } }, "大会をつくる"))),
      h("div", { class: "tl" }, rows.map(function (r) {
        return h("a", { class: "tl__row", href: "#desk" },
          h("span", { class: "tl__name" }, r.name, r.warn ? " " : "", r.warn ? h("span", { class: "tag tag--warn" }, "確認 " + r.warn) : null),
          h("span", { class: "tl__meta" }, r.meta),
          h("span", { class: "tl__count num" }, h("b", {}, r.entries), "出場・" + r.team + "団体"));
      })));
  }
  // 見本ページの共通の枠
  function frame(renderDesk) {
    var root = document.getElementById("app");
    function draw() {
      var isList = location.hash === "#list";
      root.textContent = "";

<script>
(function(){
  var h=M.h, q="", only="all", picked=null;
  function count(s,k){return s.entries.filter(function(e){return e.ev===k;}).length;}
  function visible(){return M.SUBS.filter(function(s){
    if(only==="warn"&&!s.issues.length)return false;
    if(only!=="all"&&only!=="warn"&&s.route!==only)return false;
    if(!q)return true;
    return (s.team+s.contact+s.entries.map(function(e){return e.label+e.kana;}).join("")).indexOf(q)>=0;
  });}
  function tags(s){return s.issues.map(function(i){return h("span",{class:"tag "+(i.type==="dup"?"tag--dup":"tag--warn")},i.title);});}
  var out=[h("button",{class:"btn btn--main",type:"button",onclick:function(){M.toast("集計表をExcelで保存します（見本）");}},"集計表をExcelで保存"),h("button",{class:"btn",type:"button",onclick:function(){M.toast("名簿を印刷します（見本）");}},"名簿を印刷")];
  function chip(v,l,c){return h("button",{class:"chip"+(c||""),type:"button","aria-pressed":String(only===v),onclick:function(){only=v;render();}},l);}
  function open(s){picked=s; if(matchMedia("(min-width:960px)").matches)render(); else M.sheet(s.team,M.subDetail(s));}
  var host=h("div",{});
  function render(){
    host.textContent="";
    var rows=visible();
    host.appendChild(h("div",{class:"tools"},
      h("div",{class:"find"},h("input",{class:"search",type:"search",value:q,placeholder:"団体名・氏名で探す","aria-label":"申込を探す",oninput:function(e){q=e.target.value;renderList();}}),h("button",{class:"btn",type:"button",onclick:M.collect},"申込を追加")),
      h("div",{class:"filters"},chip("all",["すべて",h("b",{},M.SUBS.length)]),chip("warn",["確認",h("b",{},M.issues().length)]," chip--warn"),chip("Excel",["Excel",h("b",{},M.routeCount("Excel"))]),chip("手入力",["手入力",h("b",{},M.routeCount("手入力"))]))));
    host.appendChild(listBox);
    renderList();
  }
  var listBox=h("div",{});
  function renderList(){
    listBox.textContent="";
    var rows=visible();
    // スマホの台帳
    listBox.appendChild(h("div",{class:"ledger"},rows.map(function(s){
      return h("button",{class:"row",type:"button",onclick:function(){open(s);}},
        h("span",{class:"row__team"},s.team),
        h("span",{class:"row__sum num"},s.entries.length,h("small",{},"出場")),
        h("span",{class:"row__by"},M.EVENTS.filter(function(e){return count(s,e.key);}).map(function(e,i){return [i?"・":"",e.short+" ",h("b",{class:"num"},count(s,e.key))];})),
        s.issues.length?h("span",{class:"row__tags"},tags(s)):null);
    }),rows.length?null:h("p",{style:"padding:18px 0;color:var(--sub)"},"条件に合う申込はありません。「すべて」に戻してください。")));
    listBox.appendChild(h("div",{class:"totals num"},M.EVENTS.map(function(e){return h("div",{},h("span",{},e.short),h("b",{},M.evCount(e.key)));}),h("div",{},h("span",{},"出場 計"),h("b",{},M.entriesTotal()))));
    listBox.appendChild(h("div",{class:"dock"},out));
    // PCの台帳
    listBox.appendChild(h("div",{class:"wrap"},
      h("div",{class:"table",tabindex:"0","aria-label":"申込の台帳"},h("table",{},
        h("thead",{},h("tr",{},h("th",{},"団体"),M.EVENTS.map(function(e){return h("th",{},e.short);}),h("th",{},"出場"),h("th",{},"経路"),h("th",{},"受付"),h("th",{},"確認"))),
        h("tbody",{},rows.map(function(s){return h("tr",{"aria-selected":picked===s?"true":null,onclick:function(){open(s);}},
          h("td",{},s.team),
          M.EVENTS.map(function(e){var c=count(s,e.key);return h("td",{class:"num"+(c?"":" zero")},c||"−");}),
          h("td",{class:"num sum"},s.entries.length),h("td",{},s.route),h("td",{class:"num"},s.at),
          h("td",{},s.issues.length?h("span",{class:"tag "+(s.issues[0].type==="dup"?"tag--dup":"tag--warn")},s.issues.length+"件"):"")
        );})),
        h("tfoot",{},h("tr",{},h("td",{},"合計 "+M.SUBS.length+"団体"),M.EVENTS.map(function(e){return h("td",{class:"num"},M.evCount(e.key));}),h("td",{class:"num"},M.entriesTotal()),h("td",{}),h("td",{}),h("td",{}))))),
