# GitHub Actions: 本番の PUBLIC_BASE_URL を設定する(手動実行のみ)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 運営アカウントの招待メールに載せる管理画面のアドレス(/etc/ktta.env の PUBLIC_BASE_URL)を、
# SSH に入らずに書き換えるための作業。デプロイと同じ GitHub Secrets の鍵で接続する。
#
# 使い方: GitHub の Actions タブ → 「本番の PUBLIC_BASE_URL を設定」→ Run workflow → アドレスを選ぶ
#
# やること: ①/etc/ktta.env をバックアップ ②PUBLIC_BASE_URL を書き込み ③メール設定の有無を「項目名だけ」表示
#           ④サービス再起動 ⑤動作確認。鍵・パスワードの値はログに出さない。
# アドレスは選択式。入力値はスクリプトへ直接埋め込まず環境変数で渡し、サーバー側でも許可リストと照合する。
# kushirotta.jp 移行時は下の候補を選ぶ(移行手順書 B-1)。
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: 本番の PUBLIC_BASE_URL を設定

on:
  workflow_dispatch:
    inputs:
      url:
        description: "管理画面のアドレス"
        type: choice
        required: true
        default: "https://140-245-94-114.nip.io"
        options:
          - "https://140-245-94-114.nip.io"
          - "https://ktta.kushirotta.jp"

concurrency:
  group: oracle-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  set-url:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PUBLIC_BASE_URL を書き込んで再起動
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_URL: ${{ inputs.url }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          envs: TARGET_URL
          script_stop: true
          script: |
            set -e
            F=/etc/ktta.env
            case "$TARGET_URL" in
              https://140-245-94-114.nip.io) URL=https://140-245-94-114.nip.io ;;
              https://ktta.kushirotta.jp) URL=https://ktta.kushirotta.jp ;;
              *) echo "想定外のアドレスです"; exit 1 ;;
            esac
            BAK="$F.bak-$(date +%Y%m%d-%H%M%S)"
            sudo cp -p "$F" "$BAK"
            echo "バックアップ: $BAK"
            if sudo grep -q '^PUBLIC_BASE_URL=' "$F"; then
              sudo sed -i "s|^PUBLIC_BASE_URL=.*|PUBLIC_BASE_URL=$URL|" "$F"
            else
              echo "PUBLIC_BASE_URL=$URL" | sudo tee -a "$F" >/dev/null
            fi
            echo "設定後:"
            sudo grep '^PUBLIC_BASE_URL=' "$F"
            echo "メール設定(値は出さない):"
            for k in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_FROM; do
              if sudo grep -qE "^$k=.+" "$F"; then echo "  $k: 設定あり"; else echo "  $k: 未設定"; fi
            done
            sudo /bin/systemctl restart ktta
            sleep 5
            curl -fs http://localhost:3000/api/health
            echo ""
            echo "完了。戻すとき: sudo cp -p $BAK $F && sudo systemctl restart ktta"
